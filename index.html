<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileVault — Upload & Download</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128194;</text></svg>">
</head>
<body>
    <div class="bg-grid"></div>

    <header>
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                        <polyline points="13 2 13 9 20 9"></polyline>
                    </svg>
                </div>
                <h1>FileVault</h1>
            </div>
            <div class="header-stats">
                <div class="stat" id="file-count">
                    <span class="stat-value">0</span>
                    <span class="stat-label">files</span>
                </div>
                <div class="stat" id="total-size">
                    <span class="stat-value">0 B</span>
                    <span class="stat-label">total</span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="upload-section">
            <div class="drop-zone" id="drop-zone">
                <div class="drop-zone-content">
                    <div class="drop-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </div>
                    <h2>Drop files here</h2>
                    <p>or <label class="browse-btn" for="file-input">browse</label> to choose</p>
                    <div class="drop-zone-meta">
                        <span class="badge badge-py">.py</span>
                        <span class="badge badge-zip">.zip</span>
                        <span class="badge badge-exe">.exe</span>
                        <span class="badge badge-blocked">.mp4 .mp3 blocked</span>
                    </div>
                </div>
                <input type="file" id="file-input" multiple hidden>
            </div>
            <div class="upload-progress" id="upload-progress" hidden>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <p class="progress-text" id="progress-text">Uploading...</p>
            </div>
        </section>

        <section class="files-section">
            <div class="files-header">
                <h2>Your Files</h2>
                <div class="files-controls">
                    <div class="search-box">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="search-input" placeholder="Search files...">
                    </div>
                    <button class="btn-refresh" id="btn-refresh" title="Refresh file list">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="files-grid" id="files-grid">
                <div class="loading-state" id="loading-state">
                    <div class="spinner"></div>
                    <p>Loading files...</p>
                </div>
            </div>
            <div class="empty-state" id="empty-state" hidden>
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                <p>No files uploaded yet</p>
                <span>Drop a file above to get started</span>
            </div>
        </section>
    </main>

    <div class="toast-container" id="toast-container"></div>

    <footer>
        <p>Powered by GitHub Repositories &middot; Max 100 MB per file</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
